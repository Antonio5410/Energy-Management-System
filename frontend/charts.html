<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Energy Management - Monitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- NAVBAR COMUN -->
  <header class="top-bar">
    <div class="brand">Energy Management</div>
    <nav class="top-nav">
      <a href="/index.html">Admin</a>
      <a href="/charts.html" class="active">Monitoring</a>
    </nav>
  </header>

  <main class="page-container">
    <h1 class="page-title">Consumption Monitoring</h1>

    <!-- FORM CONTROLS -->
    <form id="monitoringForm" class="monitoring-controls">
      <div class="monitoring-field">
        <label for="userSelect">User</label>
        <select id="userSelect"></select>
      </div>

      <div class="monitoring-field">
        <label for="deviceSelect">Device</label>
        <select id="deviceSelect"></select>
      </div>

      <div class="monitoring-field">
        <label for="dayInput">Day</label>
        <input type="date" id="dayInput" />
      </div>

      <div class="button-group">
        <button type="submit" id="loadDataBtn" class="primary-btn">
          Load consumption
        </button>
      </div>
    </form>

    <div id="statusMessage" class="status"></div>

    <!-- CHART SECTION -->
    <section class="chart-section">
      <h2 class="section-title">Energy consumption (kWh)</h2>
      <div class="chart-container">
        <canvas id="consumptionChart"></canvas>
      </div>
    </section>
  </main>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Logica pentru pagina de charts -->
  <script src="charts.js"></script>
</body>
</html>
