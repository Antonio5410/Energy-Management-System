<script src="login.js"></script>
<script>
  const token = getToken();
  const role = getRole();

  if (!token) {
    window.location.href = "/login.html";
  } else if (role === "ADMIN") {
    window.location.href = "/admin.html";
  } else if (role === "CLIENT") {
    window.location.href = "/client.html"; // sau charts.html dacă vrei la client tot charts
  } else {
    // role lipsă/invalid → curățăm și relog
    logout();
  }
</script>
