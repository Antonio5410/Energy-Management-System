<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Energy Management - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
    <main class="auth-container">
        <div class="auth-card">
        <h1 class="auth-title">Energy Management</h1>
        <p class="auth-subtitle">Log in to manage your devices & monitoring.</p>

        <form id="loginForm" class="auth-form">
            <div class="auth-field">
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" required />
            </div>

            <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required />
            </div>

            <button class="primary-btn full" type="submit">Login</button>
        </form>

        <div id="loginStatus" class="status"></div>

        <div class="auth-footer">
            <span>No account?</span>
            <a class="link-btn" href="/register.html">Create one</a>
        </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
