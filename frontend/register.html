<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Energy Management - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
    <main class="auth-container">
        <div class="auth-card">
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Just enough info for the database gods.</p>

        <form id="registerForm" class="auth-form">
            <div class="auth-field">
                <label>Username</label>
                <input id="username" type="text" required />
            </div>

            <div class="auth-field">
                <label>Password</label>
                <input id="password" type="password" required />
            </div>

            <div class="auth-field">
                <label>Name</label>
                <input id="name" type="text" required />
            </div>

            <div class="auth-field">
                <label>Address</label>
                <input id="address" type="text" required />
            </div>

            <div class="auth-field">
                <label>Age</label>
                <input id="age" type="number" required />
            </div>

            <button class="primary-btn full" type="submit">Register</button>
        </form>

        <div id="registerStatus" class="status"></div>
        <script src="./register.js"></script>



        <div class="auth-footer">
            <a class="link-btn" href="/login.html">Back to login</a>
        </div>
        </div>
    </main>

</body>
</html>
