<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <title>WS Client Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 16px; }
        input { padding: 6px; margin: 4px 0; width: 320px; }
        button { padding: 6px 12px; margin-top: 8px; }
        #log { border: 1px solid #ddd; padding: 10px; margin-top: 12px; min-height: 200px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>WS Client (User)</h2>

    <div>
        <label>UserId (eu):</label><br />
        <input id="userId" value="1" />
    </div>

    <div>
        <label>To (ADMIN sau userId):</label><br />
        <input id="to" value="ADMIN" />
    </div>

    <div>
        <label>Mesaj:</label><br />
        <input id="content" value="Salut de la client!" />
    </div>

    <button id="btnConnect">Connect</button>
    <button id="btnSend" disabled>Send</button>

    <div id="log"></div>

    <!-- SockJS + STOMP (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>
        let stompClient = null;

        function log(line) {
        const el = document.getElementById("log");
        el.textContent = line + "\n" + el.textContent;
        }

        function connect() {
        const userId = document.getElementById("userId").value.trim();
        if (!userId) { alert("Pune un userId"); return; }

        const socket = new SockJS("http://localhost:8085/ws");
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // scoate spam-ul din consola

        stompClient.connect({}, function() {
            log("✅ Connected as userId=" + userId);

            // subscribe la topic-ul userului
            stompClient.subscribe("/topic/chat.user." + userId, function(message) {
                log("📥 /topic/chat.user." + userId + ": " + message.body);
            });

            stompClient.subscribe("/topic/notify.user." + userId, function(message) {
                log("🔔 NOTIFY /topic/notify.user." + userId + ": " + message.body);
            });

            document.getElementById("btnSend").disabled = false;
        }, function(err) {
            log("❌ Connect error: " + JSON.stringify(err));
        });
        }

        function send() {
        const userId = document.getElementById("userId").value.trim();
        const to = document.getElementById("to").value.trim();
        const content = document.getElementById("content").value;

        const payload = { fromUserId: userId, to: to, content: content };

        stompClient.send("/app/chat.send", {}, JSON.stringify(payload));
        log("📤 Sent: " + JSON.stringify(payload));
        }

        document.getElementById("btnConnect").addEventListener("click", connect);
        document.getElementById("btnSend").addEventListener("click", send);
    </script>
</body>
</html>
