http:
  routers:
    # Frontend (static HTML)
    nginx-frontend:
      rule: "Host(`localhost`) && PathPrefix(`/`)"
      entryPoints:
        - web
      service: nginx-frontend
      priority: 1   # prioritate mai mică decât API-urile

    # People service - API
    backend-people:
      rule: "Host(`localhost`) && PathPrefix(`/people`)"
      entryPoints:
        - web
      middlewares:
        - auth-basic
      service: people-service
      priority: 20  # mai mare decât frontend

    backend-auth:
      rule: "Host(`localhost`) && PathPrefix(`/auth`)"
      entryPoints:
        - web
      service: auth-service
      priority: 20

    # Device service - API
    backend-device:
      rule: "Host(`localhost`) && PathPrefix(`/devices`)"
      entryPoints:
        - web
      middlewares:
        - auth-basic
      service: device-service
      priority: 20  # la fel, peste frontend

    realtime-ws:
      rule: "Host(`localhost`) && (Path(`/ws`) || PathPrefix(`/ws/`))"
      entryPoints:
        - web
      service: realtime-support
      priority: 200

  services:
    # Nginx frontend – numele corect în rețeaua Docker
    nginx-frontend:
      loadBalancer:
        servers:
          - url: "http://nginx-frontend:80"
        passHostHeader: true

    # People service backend
    people-service:
      loadBalancer:
        servers:
          - url: "http://people-service:8080"

    # Auth service backend
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:8080"

    # Device service backend
    device-service:
      loadBalancer:
        servers:
          - url: "http://device-service:8080"
          

    realtime-support:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8085"

  middlewares:
    # Basic auth pt. /people și /devices
    auth-basic:
      basicAuth:
        users:
          - "antonio:$2y$05$7CPPtiu9zKraabRIGgiMFuREtd8qp9FcocfSPQe9RS.mtwnz2/2Ji"
